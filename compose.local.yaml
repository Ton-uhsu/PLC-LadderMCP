# Local development only. No VPS or production deployment resources.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: plc_local
      POSTGRES_PASSWORD: plc_local_dev
      POSTGRES_DB: plc_ladder_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - plc_ladder_local_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc_local -d plc_ladder_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  plc_ladder_local_data:
